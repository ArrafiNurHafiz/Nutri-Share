[project]
name = "nutrishare"
version = "2.0.0"
description = "NutriShare - Platform Donasi Makanan (Python Backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.18",
    "structlog>=25.1.0",
    "numpy>=2.2.0",
    "bcrypt>=4.2.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "supabase>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
